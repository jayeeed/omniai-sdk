[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniai-kit"
version = "1.0.1"
description = "Official Python client SDK for OmniAI Gateway and Dynamic Multi-Provider LLM Router"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "OmniAI Team", email = "dev@omniai.ai" },
    { name = "Jayed Bin Jahangir", email = "jayedbinjahangir@gmail.com" },
]
maintainers = [
    { name = "Jayed Bin Jahangir", email = "jayedbinjahangir@gmail.com" },
]
keywords = [
    "omniai",
    "llm",
    "ai",
    "gateway",
    "router",
    "openai",
    "gemini",
    "anthropic",
    "vllm",
    "livekit",
    "sdk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
all = [
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "anthropic>=0.20.0",
]
openai = ["openai>=1.0.0"]
gemini = ["google-genai>=0.1.0"]
anthropic = ["anthropic>=0.20.0"]
vllm = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://omniai.go-agents.app"
Documentation = "https://omniai.go-agents.app/docs"
Repository = "https://github.com/jayeeed/omniai-sdk"
Issues = "https://github.com/jayeeed/omniai-sdk/issues"
Changelog = "https://github.com/jayeeed/omniai-sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["omniai*"]

[tool.setuptools.package-data]
omniai = ["py.typed"]
